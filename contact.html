<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
</head>
<body>

  <header>
    <h1>Contact Us</h1>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <p>Feel free to reach out to us through any of the following:</p>

    <ul>
      <li><strong>Email:</strong> nashybusiness@gmail.com</li>
      <li><strong>Phone:</strong> +63 916 319 729</li>
      <li><strong>Facebook:</strong> facebook.com/nashystindahan</li>
    </ul>

    <form action="#" method="POST">

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="subject">Subject:</label>
        <select id="subject" name="subject">
            <option value="product-question">Product Question</option>
            <option value="order-status">Order Status</option>
            <option value="wholesale-enquiry">Wholesale Enquiry</option>
            <option value="something-else">Something Else</option>
        </select>
    </div>

    <div>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit">Send message</button>

</form>

  </main>

  <footer>
    <p>&copy; 2026 Nashy's Tindahan. All rights reserved.</p>
  </footer>

</body>
</html>
